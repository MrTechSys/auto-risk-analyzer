name: Security Audit
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Dependency Audit
        run: npm audit --audit-level=high
        
      - name: Run Secret Scanning Simulation
        run: |
          # Basic check for high-entropy strings or common secret patterns
          # This is a supplement to GitHub's native secret scanning
          grep -rE "(key|secret|password|token)[[:space:]]*[:=]" . --exclude-dir=node_modules || true
